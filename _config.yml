title: Agent Engineering Lab
description: 面向中文开发者的 Agent Systems Engineering 可执行实验室：用任务合同、证据、Trace、Dataset、Eval 和 Regression 证明 Agent 行为。
url: https://estelledc.github.io
baseurl: /langchain-langgraph-langsmith-tutorial
repository: estelledc/langchain-langgraph-langsmith-tutorial
lang: zh-CN
locale: zh_CN
timezone: Asia/Shanghai
author:
  name: Jason Xun
  url: https://estelledc.github.io/
logo: /assets/og-agent-engineering-lab.png
theme: jekyll-theme-cayman
plugins:
  - jekyll-relative-links
  - jekyll-default-layout
  - jekyll-readme-index
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: true
readme_index:
  enabled: true
  remove_originals: true
  with_frontmatter: false
defaults:
  - scope:
      path: ""
    values:
      layout: default
sass:
  style: compressed
exclude:
  - .env
  - .env.example
  - .github/
  - .python-version
  - .venv/
  - AGENTS.md
  - CHANGELOG.md
  - Gemfile
  - Gemfile.lock
  - Makefile
  - curriculum/
  - datasets/
  - evals/
  - fixtures/
  - langgraph.json
  - legacy/
  - prompts/
  - pyproject.toml
  - scripts/
  - skills/
  - src/
  - tests/
  - uv.lock
  - vendor/
  - verification-passport.json
  - "**/__pycache__/"
  - "**/*.pyc"
header_pages:
  - SETUP.md
  - labs/README.md
  - docs/architecture.md
  - docs/verification.md
  - docs/compatibility.md
