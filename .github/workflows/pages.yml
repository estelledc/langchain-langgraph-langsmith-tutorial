name: Verify and Deploy GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.28'
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked environment
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Build wheel and sdist
        if: matrix.python-version == '3.13'
        run: uv build --clear

      - name: Run complete offline gate
        if: matrix.python-version != '3.13'
        run: uv run agent-lab verify

      - name: Run gate and build verification passport
        if: matrix.python-version == '3.13'
        run: >
          uv run agent-lab verify
          --passport-output verification-passport.json
          --artifact-dir dist

      - name: Upload verification evidence
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-evidence
          path: |
            verification-passport.json
            evals/reports/fast.json
            evals/reports/security.json
            evals/reports/contracts.json
            dist/*
          if-no-files-found: error

  artifact-install:
    name: Clean wheel and extras install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.28'
          python-version: '3.13'
          enable-cache: true

      - name: Build distributions
        run: uv build --clear

      - name: Install wheel with every optional extra
        run: |
          uv venv /tmp/agent-lab-wheel --python 3.13
          wheel="$(find dist -name '*.whl' -print -quit)"
          uv pip install --python /tmp/agent-lab-wheel/bin/python "${wheel}[all]"

      - name: Smoke installed commands outside the source tree
        working-directory: /tmp
        run: |
          /tmp/agent-lab-wheel/bin/agent-lab --help
          /tmp/agent-lab-wheel/bin/agent-lab run --goal "LangGraph checkpointer"
          /tmp/agent-lab-wheel/bin/agent-lab eval --suite fast --report /tmp/fast.json
          /tmp/agent-lab-wheel/bin/agent-lab eval --suite security --report /tmp/security.json
          /tmp/agent-lab-wheel/bin/agent-lab eval --suite contracts --report /tmp/contracts.json
          /tmp/agent-lab-wheel/bin/xcodefix task --task keyboard-layout-001

      - name: Smoke optional imports
        run: |
          /tmp/agent-lab-wheel/bin/python - <<'PY'
          import deepagents
          import langchain_openai
          import langgraph_cli
          import langsmith
          from langgraph.checkpoint.sqlite import SqliteSaver

          assert deepagents
          assert langchain_openai
          assert langgraph_cli
          assert langsmith
          assert SqliteSaver
          PY

  site:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.28'
          python-version: '3.13'
          enable-cache: true

      - name: Install locked environment
        run: uv sync --frozen

      - name: Setup Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Check rendered V2 contract
        run: uv run python scripts/check_site.py --built _site

      - name: Check internal links
        run: >
          bundle exec htmlproofer _site
          --disable-external
          --no-enforce-https
          --swap-urls '^/langchain-langgraph-langsmith-tutorial:'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    name: Deploy production Pages
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [python, artifact-install, site]
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
